name: Feature request
description: Propose a focused improvement to OpenRetention.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What operator or customer-success workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Why this belongs in OpenRetention
      description: Explain how it fits the focused self-hosted retention workflow rather than a generic feature checklist.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the existing issues and roadmap for duplicates.
          required: true
        - label: I have not described a planned integration or capability as already shipped.
          required: true
