name: Bug report
description: Report a reproducible problem in OpenRetention.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include secrets, private customer data, or exploitable vulnerability details. Security issues belong in the private reporting path described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reliable set of steps, input data, or API calls that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenRetention version or commit
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: "Node version, OS, Docker if relevant"
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Add sanitized evidence that helps reproduce or diagnose the problem.
