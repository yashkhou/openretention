<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenRetention</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#0b0e14; color:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at top left,#182033 0,#0b0e14 38%); min-height:100vh; }
    main { max-width:1180px; margin:0 auto; padding:42px 24px 80px; }
    .top { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:28px; }
    h1 { margin:0; font-size:34px; letter-spacing:-1.2px; }
    .sub { color:#9098a9; margin-top:7px; }
    .pill { border:1px solid #293147; padding:8px 12px; border-radius:999px; color:#b7c0d4; font-size:13px; }
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:26px; }
    .card { background:rgba(19,24,36,.8); border:1px solid #222a3b; border-radius:18px; padding:18px; backdrop-filter:blur(10px); }
    .label { color:#8d97aa; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .metric { font-size:28px; font-weight:700; margin-top:8px; }
    .risk { color:#ffb4aa; }
    .section-title { display:flex; justify-content:space-between; align-items:center; margin:24px 0 12px; }
    h2 { font-size:18px; margin:0; }
    table { width:100%; border-collapse:collapse; overflow:hidden; }
    th,td { padding:14px 12px; text-align:left; border-bottom:1px solid #222a3b; font-size:14px; }
    th { color:#7f899d; font-size:11px; text-transform:uppercase; letter-spacing:.07em; }
    tr:last-child td { border-bottom:0; }
    .score { display:inline-flex; min-width:50px; justify-content:center; padding:5px 9px; border-radius:999px; font-weight:700; border:1px solid; }
    .green { color:#7fe0ad; border-color:#285b43; background:#11291e; }
    .amber { color:#ffd27a; border-color:#654b1c; background:#2f2410; }
    .red { color:#ff9587; border-color:#6c302d; background:#321615; }
    .reason { color:#a8b1c2; font-size:12px; max-width:360px; }
    @media (max-width:800px){ .metrics{grid-template-columns:1fr 1fr}.top{align-items:start;flex-direction:column}.table-wrap{overflow:auto} }
  </style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>OpenRetention</h1><div class="sub">The self-hosted customer success OS for B2B SaaS.</div></div>
    <div class="pill">Risk inbox · transparent health scoring · no seat tax</div>
  </div>
  <section class="metrics" id="metrics"></section>
  <div class="section-title"><h2>Risk inbox</h2><span class="sub">Highest revenue risk first</span></div>
  <div class="card table-wrap"><table><thead><tr><th>Account</th><th>MRR</th><th>Health</th><th>Renewal</th><th>Why it is at risk</th></tr></thead><tbody id="risk"></tbody></table></div>
  <div class="section-title"><h2>All accounts</h2><span class="sub">Demo data seeded locally</span></div>
  <div class="card table-wrap"><table><thead><tr><th>Account</th><th>MRR</th><th>Usage 7d</th><th>Previous 7d</th><th>Health</th></tr></thead><tbody id="accounts"></tbody></table></div>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
